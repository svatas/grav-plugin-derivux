name: Derivux by Gravister
slug: gravister-derivux
type: plugin
version: 0.6.2
description: Safe Admin2 scaffolder for minimal inherited Grav 2 themes.
icon: code-branch
author:
  name: Svatopluk Vít
keywords:
  - grav
  - grav2
  - admin2
  - inheritance
  - child-theme
  - derived-theme
  - scaffolder
  - derivux
license: MIT
dependencies:
  - name: grav
    version: '>=2.0.0'
  - name: api
    version: '>=1.0.0'
  - name: admin2
    version: '>=2.0.0'
form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: Plugin enabled
      default: 1
      options:
        1: Enabled
        0: Disabled
