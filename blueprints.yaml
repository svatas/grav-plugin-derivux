name: Derivux
slug: derivux
type: plugin
version: 0.1.0
description: Minimal derived-theme tooling for Grav 2 using native theme inheritance.
icon: clone
author:
  name: Svatopluk Vít
license: MIT

dependencies:
  - { name: grav, version: '>=2.0.0' }

form:
  validation: loose
  fields:
    enabled:
      type: toggle
      label: PLUGIN_ADMIN.PLUGIN_STATUS
      highlight: 1
      default: 1
      options:
        1: PLUGIN_ADMIN.ENABLED
        0: PLUGIN_ADMIN.DISABLED
      validate:
        type: bool
